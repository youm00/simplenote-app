name: supabase-keepalive
on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 09:00 JST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          code=$(curl -sS -o /tmp/res.txt -w '%{http_code}' --retry 3 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/notes?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $code"
          cat /tmp/res.txt
          case "$code" in 2*) ;; *) exit 1 ;; esac